spring.application.name=academico
server.port=8080

# Configuração Banco H2 (Funciona direto sem instalar nada)
spring.datasource.url=jdbc:h2:file:./data/academico_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Para usar PostgreSQL, basta comentar o H2 acima e descomentar abaixo:
# spring.datasource.url=jdbc:postgresql://localhost:5432/academico_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chave Secreta JWT
api.security.token.secret=${JWT_SECRET:chave-secreta-super-segura-projeto-front-end-2026}

